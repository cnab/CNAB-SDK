name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: build spec + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Compile + validate spec, run all workspace tests
        run: npm test

      # Actually build the tarballs and inspect their contents. Both packages
      # once would have published without their `main` entry point; the fast
      # declarative check inside `npm test` cannot catch a prepack that runs
      # but fails to emit what `files` promises.
      - name: Verify published tarball contents
        run: npm run check:packaging

  jsii:
    name: jsii multi-language API check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Prove the @cnab/core public API is jsii-compatible (Node/.NET/Python/Java).
      # We compile the jsii assembly only; we do NOT publish.
      # Uses the jsii pinned in packages/core devDependencies, so CI validates
      # against the same compiler version `prepack` publishes with.
      - name: jsii compile (packages/core)
        run: npm run build:jsii --workspace @cnab/core
      - name: Upload jsii assembly
        uses: actions/upload-artifact@v4
        with:
          name: jsii-assembly
          path: packages/core/.jsii
          # .jsii is a dotfile; upload-artifact@v4 skips hidden files by default
          include-hidden-files: true
          if-no-files-found: error

  pacmak:
    name: jsii-pacmak language bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # pacmak shells out to each language's toolchain, so they must be present.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - run: npm install
      - name: Build spec + jsii assembly
        run: npm run build:spec && npm run build:jsii --workspace @cnab/core
      # Generating the bindings is the only thing that proves the API is
      # *projectable* in practice rather than just in principle. We generate
      # and smoke-test them; we do NOT publish (that is #14 and its children).
      - name: jsii-pacmak (python, java, dotnet)
        working-directory: packages/core
        run: npx jsii-pacmak --targets python --targets java --targets dotnet
      - name: Smoke-test the generated Python wheel
        run: |
          python -m venv /tmp/cnabvenv
          /tmp/cnabvenv/bin/pip install --quiet packages/core/dist/python/*.whl
          /tmp/cnabvenv/bin/python - <<'PY'
          import cnab_core as c
          spec = c.CnabSpec.bundled()
          assert len(spec.record_keys()) > 50, spec.record_keys()
          rec = spec.get_record('cnab240/104/sigcb/header_arquivo')
          line = rec.to_line({'codigo_banco': '104'})
          assert len(line) == 240 and line[:3] == '104', repr(line[:10])
          assert rec.to_line(rec.parse(line)) == line, 'round-trip failed'
          print(f'python binding OK — {len(spec.record_keys())} records from the bundled spec')
          PY
      - name: Upload language bindings
        uses: actions/upload-artifact@v4
        with:
          name: language-bindings
          path: packages/core/dist
          if-no-files-found: error

  # Real unit suites per language, run against the GENERATED artifacts rather
  # than the TypeScript source. The Node suite cannot see projection bugs:
  # `setDecimal` was void + mutate, which works in Node (objects by reference)
  # and silently did nothing in Python/Java/.NET, because jsii marshals maps by
  # value. Two documented helpers were inert in three of four shipped languages
  # and every Node test passed. See bindings/README.md.
  bindings:
    name: ${{ matrix.language }} binding unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one language failing must not hide the others
      matrix:
        language: [python, java, dotnet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'dotnet'
        with:
          dotnet-version: '8.0'
      - run: npm install

      - name: Build spec + jsii assembly
        run: npm run build:spec && npm run build:jsii --workspace @cnab/core

      - name: Generate the ${{ matrix.language }} binding
        working-directory: packages/core
        run: npx jsii-pacmak --targets ${{ matrix.language }}

      - name: Resolve the version under test
        id: v
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

      # --- python ---------------------------------------------------------
      - name: Python — install the wheel and run pytest
        if: matrix.language == 'python'
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pytest packages/core/dist/python/*.whl
          /tmp/venv/bin/python -m pytest bindings/python -v

      # --- java -----------------------------------------------------------
      - name: Java — install the jar and run JUnit
        if: matrix.language == 'java'
        run: |
          V="${{ steps.v.outputs.version }}"
          D="packages/core/dist/java/org/cnab/cnab-core/$V"
          mvn -B -q install:install-file -Dfile="$D/cnab-core-$V.jar" -DpomFile="$D/cnab-core-$V.pom"
          mvn -B -f bindings/java/pom.xml -Dcnab.version="$V" test

      # --- dotnet ---------------------------------------------------------
      - name: .NET — restore from the local feed and run xUnit
        if: matrix.language == 'dotnet'
        run: |
          V="${{ steps.v.outputs.version }}"
          FEED="$(pwd)/packages/core/dist/dotnet"
          dotnet nuget add source "$FEED" --name cnab-local
          dotnet test bindings/dotnet/Cnab.Core.BindingTests.csproj \
            -p:CnabVersion="$V" --verbosity normal
