name: Docs (GitHub Pages)

# Builds the developer API reference (TypeDoc) and publishes it to GitHub Pages
# at https://cnab.github.io/CNAB-SDK/.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". Production is published from the default branch (main).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install

      # REQUIRED before `docs`. packages/core/src/spec.generated.ts is
      # gitignored and emitted by tools/embed-spec.mjs, so on a fresh checkout
      # index.ts imports a module that does not exist yet and typedoc exits 3
      # with "Cannot find module './spec.generated'". Every run of this workflow
      # failed that way until it was noticed.
      - name: Build the spec (generates src/spec.generated.ts)
        run: npm run build:spec

      - name: Generate API reference (TypeDoc -> site/)
        run: npm run docs

      # typedoc exits non-zero on error, but do not rely on that alone:
      # publishing an empty site is worse than failing, because it looks like
      # a successful deploy.
      - name: Verify the site was actually generated
        run: |
          test -f site/index.html
          test -d site/classes
          echo "site: $(find site -type f | wc -l) files" >> "$GITHUB_STEP_SUMMARY"

      # `enablement: true` creates the Pages site via the API if it does not
      # exist, instead of failing with "Get Pages site failed ... Not Found" --
      # which is what every run of this workflow did from June onwards, because
      # Pages was never switched on in repo settings.
      #
      # If org policy forbids Actions from enabling Pages this still fails, and
      # the manual step is Settings -> Pages -> Source: "GitHub Actions" (#21).
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
